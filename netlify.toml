# Netlify config for the Cave Bellevin demo. The Next app lives in site/.
[build]
  base = "site"
  command = "npm run build"
  publish = ".next"

# The Next.js runtime MUST be declared explicitly.
#
# Netlify's framework auto-detection does not fire when `base` points at a subdirectory, so the
# first deploy ran `next build` and then published the raw .next directory as a static site: no
# index.html at the root, no SSR functions, and a Netlify 404 on every path. The tell was that
# /BUILD_ID and /build-manifest.json returned 200 — files that only exist INSIDE .next.
#
# Netlify installs plugins declared here automatically; the version is left unpinned so it stays
# matched to the Next major.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "24"

# Required environment variables, set in the Netlify UI or with `netlify env:set` — never committed:
#   CTP_PROJECT_KEY   cave-bellevin-demo
#   CTP_CLIENT_ID     <api client id>
#   CTP_CLIENT_SECRET <api client secret>
#   CTP_AUTH_URL      https://auth.europe-west1.gcp.commercetools.com
#   CTP_API_URL       https://api.europe-west1.gcp.commercetools.com
#   SESSION_SECRET    openssl rand -base64 32
#
# Do NOT set NODE_EXTRA_CA_CERTS: that is a local Zscaler workaround and the path does not exist
# on a build runner.

# Keep the demo out of search results.
#
# The catalogue is derived from a commercial-in-confidence pack and the product images are
# hot-linked from a third party's CDN, so this deployment should be reachable by people given the
# link and by nobody else. noindex is the floor, not a control — for real access control use
# Netlify's site password / SSO, which is enforced at the edge.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"
